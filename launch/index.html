<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b111a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OpenNOW">
  <link rel="apple-touch-icon" id="home-icon" href="../icons/opennow.png">
  <link rel="icon" href="../icons/opennow.png">
  <title>Launch game · OpenNOW</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #0b111a; color: #f2f6fc; min-height: 100svh; display: grid; place-items: center; }
    main { width: min(360px, calc(100% - 48px)); text-align: center; padding: 32px 0; }
    img { width: 160px; height: 210px; object-fit: contain; border-radius: 14px; background: #121e2d; }
    h1 { font-size: 27px; margin: 22px 0 8px; overflow-wrap: anywhere; }
    p { color: #b0bdcf; line-height: 1.5; }
    a.launch { display: block; background: #1595ee; color: white; padding: 15px 20px; border-radius: 14px; font-weight: 600; text-decoration: none; margin-top: 24px; }
    .help { font-size: 14px; }
    .install { color: #8fcfff; }
    [hidden] { display: none !important; }
  </style>
  <script defer src="launch.js"></script>
</head>
<body>
  <main>
    <img id="artwork" src="../icons/opennow.png" alt="OpenNOW">
    <h1 id="game-title">OpenNOW</h1>
    <p id="status" role="status">Preparing your game…</p>
    <a class="launch" id="launch" hidden>Open in OpenNOW</a>
    <p class="help" id="home-help">To save this game in Safari, tap Share → Add to Home Screen.</p>
    <p class="help">iOS may ask you to open OpenNOW. If it doesn’t open, tap the button above.</p>
    <a class="install" href="https://github.com/joemossjr16/ios-apps/releases">Get OpenNOW</a>
    <noscript><p>Enable JavaScript to open this game in OpenNOW.</p></noscript>
  </main>
</body>
</html>
